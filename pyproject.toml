[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-transformer"
version = "0.1.0"
description = "Pure-NumPy autograd engine and GPT language model"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
tiny-train = "train:main"
tiny-stream = "streaming_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["train", "tokenizer", "benchmark", "streaming_cli"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
